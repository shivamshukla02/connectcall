name: connectcall
description: Connect with anyone, anywhere. A 1-to-1 audio/video calling app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Utilities (used from Phase 1 onward)
  intl: ^0.19.0
  equatable: ^2.0.5

  # Firebase (Phase 2)
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.0

  # NOTE: zego_uikit_prebuilt_call, permission_handler added in Phase 4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
